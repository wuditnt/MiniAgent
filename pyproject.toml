[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "1.0.0"
description = "一个可扩展的本地智能体 Web 应用：工具目录 + 连接（MCP）双通道"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    # 必装：模型接入
    "openai>=1.30.0",
]

[project.optional-dependencies]
# 终端富文本输出（自检脚本 / 日志表格）。不装也能跑（退回纯文本）。
console = [
    "rich>=13.0",
]

# 办公文档：装了才能读写 docx / xlsx / pptx、解析 pdf；不装也能跑（工具会提示缺哪个库）。
docs = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "charset-normalizer>=3.0",
]

# 办公文档增强：calamine 加速 Excel（含旧版 .xls）、reportlab 生成 PDF、mammoth+markdownify docx→Markdown、
# pillow 支持图片合成 PDF。
docs-fast = [
    "python-calamine>=0.2",
    "reportlab>=4.0",
    "pillow>=10.0",
    "pypdfium2>=4.0",
    "mammoth>=1.8",
    "markdownify>=0.13",
]

# 大数据表格分析：polars 的概览 / SQL / 转 Parquet（读 Excel 需 fastexcel）。
dataframe = [
    "polars>=1.0",
    "fastexcel>=0.9",
]

# 扫描件 OCR：pypdfium2 渲染 + rapidocr 识别（体积约 170MB）。
# onnxruntime 锁在 1.21 以下——实测 1.31 在部分 Windows 环境 import 即崩溃。
ocr = [
    "pypdfium2>=4.0",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.20,<1.21",
]

# 上面四组文档相关能力一次装齐：pip install -e ".[docs-all]"
docs-all = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "charset-normalizer>=3.0",
    "python-calamine>=0.2",
    "reportlab>=4.0",
    "pillow>=10.0",
    "mammoth>=1.8",
    "markdownify>=0.13",
    "polars>=1.0",
    "fastexcel>=0.9",
    "pypdfium2>=4.0",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.20,<1.21",
]

[project.scripts]
mini-agent = "core.main:main"

# ---------------------------------------------------------------------------
# 为什么是 src 布局 + 显式 package-dir？
#
#   src/core/    唯一的包：应用层（main/agent/ui/loader/skills/tools）
#                与核心库（registry/sandbox/cancel/mcp/schema/images）平铺其中。
#
# 工具作者写的是 `from core import tool`、`import tools` 这类写法，
# 其中 `import tools` 这种裸模块名不在包命名空间里，
# 靠 core/__init__.py 里的 sys.path 铺设才能找到。
# 所以**必须**声明 package-dir 让 setuptools 认识 src 布局，
# 否则 editable 安装后 src/ 不在 path 上，这些写法都会失效。
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*"]

# ---------------------------------------------------------------------------
# 静态检查配置
#
# 本项目刻意把 src/core 也当成「裸模块」导入根：main.py 脚本模式下的
# `from _paths import ...`、工具作者写的 `import tools`，运行时由
# core/_paths.py 的 install_import_paths() 铺好 sys.path。
# 类型检查器默认只认 src/，所以这里显式补上 src/core，避免误报找不到模块。
# ---------------------------------------------------------------------------
[tool.pyrefly]
search-path = [".", "src", "src/core", "tests"]

[tool.pyright]
extraPaths = [".", "src", "src/core", "tests"]
typeCheckingMode = "basic"

# Trae 的 basedpyright 比 pyright 多出若干严格检查；本项目大量使用动态导入、
# 工具装饰器和模块级可变配置，这些检查只产生噪音，不反映真实缺陷。
[tool.basedpyright]
extraPaths = [".", "src", "src/core", "tests"]
typeCheckingMode = "basic"
reportImportCycles = "none"
reportUnusedCallResult = "none"
reportConstantRedefinition = "none"
reportMissingTypeArgument = "none"
reportUntypedFunctionDecorator = "none"
