name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python 侧跑在 Windows：本项目面向本机 Windows 环境开发，
  # 沙箱、进程树、路径大小写等用例都依赖平台行为，换 Linux 会出现假失败。
  python:
    name: Python 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 办公文档 / PDF 用例需要 docs + docs-fast 这组依赖，缺了会整组跳过，
      # CI 就失去对 write_docx / pdf_* / office_to_pdf 的覆盖（不含体积很大的 OCR 组）。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,docs-fast]"
          pip install pytest

      # 失败摘要写成注解（公开仓库的注解无需登录即可查看），便于没有日志权限时定位。
      - name: 运行测试
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests -q 2>&1 | Tee-Object -FilePath pytest-out.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content pytest-out.txt |
              Where-Object { $_ -match '^(FAILED|ERROR)' } |
              Select-Object -First 10 |
              ForEach-Object {
                Write-Output ("::error::" + $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))
              }
          }
          exit $code

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      # build 脚本本身就是 `tsc --noEmit && vite build`，类型错误会直接让 CI 失败
      - name: 类型检查 + 构建
        working-directory: web
        run: npm run build
